name: WebAssembly portability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webassembly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emscripten:
    name: Emscripten build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 5.0.1
          actions-cache-folder: build/emsdk-cache
      - name: Configure
        run: >-
          emcmake cmake -S . -B build/wasm
          -DCMAKE_BUILD_TYPE=Release
          -DF2C_BUILD_TESTING=OFF
          -DF2C_ENABLE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/wasm --parallel
      - name: Validate standalone generated C17 without a filesystem
        run: |
          cmake -S . -B build/host \
            -DCMAKE_BUILD_TYPE=Release \
            -DF2C_BUILD_TESTING=OFF \
            -DF2C_ENABLE_WARNINGS_AS_ERRORS=ON
          cmake --build build/host --target f2c --parallel
          for fixture in \
            internal_file_semantics mathematical_conversion_intrinsics \
            character_designators character_array_actuals character_actual_evaluation \
            character_length_parameters character_result_effects character_broadcast_reallocation \
            type_bound_character_results derived_default_initialization \
            scope_association scope_storage_bindings \
            intrinsic_bindings intrinsic_alias_bindings etime \
            scalar_component_actuals procedure_pointer_component \
            reduction_designators nested_array_reductions volatile_reductions \
            qualified_descriptors qualified_contiguous scoped_storage_access scoped_unaligned_storage \
            live_object_state live_character_result_state live_namelist_transaction \
            live_component_assignment \
            function_result scalar_result result_identity result_snapshot result_kinds \
            constructor_result constructor_finalization \
            allocation_result allocation_result_values allocation_result_finalization \
            parenthesized_intrinsic_values parenthesized_values parenthesized_character_values; do
            build/host/f2c -o "build/wasm/generated-$fixture.c" "test/fixtures/$fixture.f90"
            emcc -std=c17 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
              -Wstrict-prototypes -Wmissing-prototypes -Werror \
              -sFILESYSTEM=0 -sEXIT_RUNTIME=1 \
              "build/wasm/generated-$fixture.c" -o "build/wasm/generated-$fixture.js"
            node "build/wasm/generated-$fixture.js"
          done
          emcc -std=c17 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes -Werror -Ibuild/wasm \
            -DF2C_DESCRIPTOR_SOURCE='"generated-qualified_descriptors.c"' \
            -sFILESYSTEM=0 -sEXIT_RUNTIME=1 \
            test/generated/descriptor_contracts.c \
            -o build/wasm/descriptor-contracts.js
          node build/wasm/descriptor-contracts.js
          build/host/f2c -o build/wasm/generated_live_external_state.c test/fixtures/live_external_state.f90
          emcc -std=c17 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes -Werror -Ibuild/wasm \
            -sFILESYSTEM=0 -sEXIT_RUNTIME=1 \
            test/generated/live_state_contracts.c -o build/wasm/live-state-contracts.js
          node build/wasm/live-state-contracts.js
          build/host/f2c -o build/wasm/result-external.c test/fixtures/result_external.f90
          emcc -std=c17 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes -Werror -Ibuild/wasm \
            -DF2C_RESULT_SOURCE='"result-external.c"' \
            -sFILESYSTEM=0 -sEXIT_RUNTIME=1 \
            test/generated/result_contracts.c -o build/wasm/result-contracts.js
          node build/wasm/result-contracts.js
          emcc -std=c17 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow \
            -Wstrict-prototypes -Wmissing-prototypes -Werror -Ibuild/wasm \
            -DF2C_CHARACTER_LENGTH_SOURCE='"generated-character_length_parameters.c"' \
            -sFILESYSTEM=0 -sEXIT_RUNTIME=1 \
            test/fixtures/character_length_width_harness.c \
            -o build/wasm/character-length-width.js
          node build/wasm/character-length-width.js
      - name: Upload WebAssembly validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: f2c-webassembly
          path: build/wasm/f2c*
          if-no-files-found: error
          retention-days: 7
